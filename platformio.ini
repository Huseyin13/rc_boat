[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12
    mikalhart/TinyGPSPlus@^1.0.3
    xreef/EByte LoRa E220 library@^1.0.8

build_flags =
    -D CORE_DEBUG_LEVEL=3
